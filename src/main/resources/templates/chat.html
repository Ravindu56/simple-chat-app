<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Real-Time Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Real-Time Chat Application</h1>
        <div id="chat" class="border rounded p-3 mb-3" style="height: 400px; overflow-y: scroll;">
            <div id="messages"></div>
        </div>

        <div class="input-group mb-3">
            <input type="text" id="messageSender" class="form-control row" placeholder="Type the sender's name" />
        </div>

        <div class="input-group mb-3 gap-3">
            <input type="text" id="messageInput" class="form-control row" placeholder="Type your message here..." />
            
            <div class="input-group-append ">
                <button id="sendButton" class="btn btn-primary">Send</button>
            </div>
        </div>
    </div>
    
</body>
</html>
