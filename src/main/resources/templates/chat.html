<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>Real-Time Chat Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Real-Time Chat Application</h1>
        <div id="chat" class="border rounded p-3 mb-3" style="height: 400px; overflow-y: scroll;">
            <div id="messages"></div>
        </div>

        <div class="input-group mb-3">
            <input type="text" id="messageSender" class="form-control row" placeholder="Type the sender's name" />
        </div>

        <div class="input-group mb-3 gap-3">
            <input type="text" id="messageInput" class="form-control row" placeholder="Type your message here..." />
            
            <div class="input-group-append ">
                <button id="sendButton" class="btn btn-primary">Send</button>
            </div>
        </div>
    </div>
    
</body>

<script>
    var stompClient = null;

    function setConnected(connected) {
        document.getElementById('sendButton').disabled = !connected;
    }

    function connect(){
        var socket = new SockJS('/chat');
        stompClient = Stomp.over(socket);
        stompClient.connect({}, function(frame){
            setConnected(true);
            stompClient.subscribe('/topic/messages', function(message){
                showMessage(JSON.parse(message.body));
            });
        });
    }

    function showMessage(message){
        var chat = document.getElementById('chat'); // Get chat container
        var messageElement = document.createElement('div'); // Create a new div for the message
        messageElement.textContent = message.sender + ": " + message.content; // Display sender and content
        messageElement.classList.add('mb-2', 'border-bottom'); // Add margin for spacing
        chat.appendChild(messageElement); // Append the message to the chat container
        chat.scrollTop = chat.scrollHeight; // Auto-scroll to the bottom
    }

    function sendMessage(){
        var sender = document.getElementById('messageSender').value;// Get sender's name
        var content = document.getElementById('messageInput').value; // Get input
        var chatMessage = {'sender': sender, 'content': content}; // Create message object
        console.log("Sending message: ", chatMessage);
        stompClient.send("/app/sendMessage", {}, JSON.stringify(chatMessage)); // Send message to server
        document.getElementById('messageInput').value = ''; // Clear input field
    }

    document.getElementById('sendButton').addEventListener('click', sendMessage);
    window.onload = connect;
</script>
</html>
